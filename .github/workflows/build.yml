name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v6

      # GitHub's Ubuntu runners include Docker, which Testcontainers needs.
      - name: Build and test
        run: ./gradlew build
